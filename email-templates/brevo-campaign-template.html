<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllSherut</title>
</head>
<body style="font-family: Arial, sans-serif; background: #F5F7FA; margin: 0; padding: 20px; direction: rtl;">

  <div style="max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 30px rgba(15,42,68,0.12);">

    <!-- HEADER -->
    <div style="background: linear-gradient(135deg, #0F2A44 0%, #1A5490 100%); padding: 28px 40px; text-align: center;">
      <div style="display: inline-block; background: white; border-radius: 14px; padding: 10px 22px; margin-bottom: 14px;">
        <img src="https://allsherut.com/images/logo-homesherut26.png" alt="AllSherut" style="width: 160px; height: auto; display: block;" />
      </div>
      <div style="color: rgba(255,255,255,0.95); font-size: 16px; font-weight: 600; font-family: Arial, sans-serif;">
        <!-- SOUS-TITRE ICI -->
      </div>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <div style="padding: 40px; direction: rtl;">

      <h2 style="color: #0F2A44; margin: 0 0 20px 0; font-size: 22px; text-align: right;">
        שלום {{contact.FIRSTNAME}},
      </h2>

      <p style="font-size: 16px; line-height: 1.7; color: #2D3748; margin-bottom: 25px; text-align: right;">
        <!-- VOTRE TEXTE ICI -->
      </p>

      <!-- BOUTON CTA -->
      <div style="text-align: center; margin: 30px 0;">
        <a href="https://allsherut.com" style="display: inline-block; background: linear-gradient(135deg, #0F2A44 0%, #2F80ED 100%); color: white; padding: 14px 36px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 4px 15px rgba(47,128,237,0.3);">
          כנס לאתר
        </a>
      </div>

    </div>

    <!-- FOOTER -->
    <div style="background: #F5F7FA; padding: 20px 40px; border-top: 1px solid #e2e8f0; text-align: center;">
      <p style="margin: 0; color: #94a3b8; font-size: 12px; font-family: Arial, sans-serif;">
        AllSherut &mdash; כל השירותים במקום אחד
      </p>
      <p style="margin: 8px 0 0 0; color: #94a3b8; font-size: 11px;">
        <a href="{{unsubscribeLink}}" style="color: #94a3b8; text-decoration: underline;">הסרה מרשימת התפוצה</a>
      </p>
    </div>

  </div>

</body>
</html>
